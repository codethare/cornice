# cornice config template
#
# Install at: $XDG_CONFIG_HOME/cornice/config.toml (usually ~/.config/cornice/config.toml)
#   mkdir -p ~/.config/cornice && cp config.toml ~/.config/cornice/config.toml
#
# When the file is missing, cornice starts on all defaults and does not error.
# When it is wrong, cornice prints a `line:column` error to stderr and exits non-zero — no guessing, no silent downgrade.
# Unknown keys, unknown module kinds and out-of-range numbers are all rejected (deny_unknown_fields).
# Every line below is optional: delete it and the key returns to its default (see "default" in the comments).
# Writing only the [bar.left] / [bar.center] / [bar.right] module lists is enough — that is where "consistency" comes from.
#
# Runtime control: `cornice bar toggle | show | hide`, `cornice notification dismiss <id> | -a | --all`.
# Reload is a signal: `pkill -USR1 -x cornice` re-execs cornice in place, so config is re-read.

[bar]
# Bar height in pixels. Range 1..=256.
# It is also the basis the shm pool size and notification proportions are derived from, so the ceiling is defensive: a
# mistyped number must not turn into a terabyte-scale allocation request.
height  = 30        # default 30
# Distance from the bar to the top edge of the screen, in pixels.
margin  = 0         # default 0
# Extra bar-background transparency, 0..100. 0 keeps the alpha in theme.background unchanged; 100 makes the
# bar background fully transparent. Text stays visible, and notification cards are not affected.
background_transparency = 0
# Left/right inset inside the square-cornered bar, in pixels.
padding = 8         # default 8
# Gap between adjacent modules, in pixels.
spacing = 6         # default 6
# Outputs this bar is created on, by wl_output name (`wlr-randr` lists them). Empty = every output.
# A name that has not arrived yet, or that the compositor never sends, matches: an unknown name is not "no bar".
outputs = []        # default []

[theme]
# Colour syntax: #rgb / #rrggbb / #rrggbbaa (ASCII only)
background = "#1a1a1aee"    # bar and notification card base colour, default #1a1a1aee
foreground = "#dcdcdc"      # text colour, default #dcdcdc
accent     = "#88c0d0"      # action pills and the focused application chip, default #88c0d0
# Notification urgency is not themable: critical always uses the warning red.
# Font: "family size". Omit the size to keep the default size of 11.
font       = "monospace 11" # default monospace 11
# Notification spacing, padding, width, radius and minimum height are derived from height and are not configurable.
# Text is placed by cap height. Each independent card keeps a fixed width; body/action rows grow its height,
# and the first card starts one card_gap below the bar.

# Each of the three areas is an ordered module list: reorder it to reorder them, delete an entry to switch it off.
# No nested containers, no layout language — that is the whole meaning of "freedom to combine".
#
# Each module may carry three optional commands, run with `sh -c`: `on_click` (left button),
# `on_scroll_up` and `on_scroll_down`. A module without any of them stays click-through, so empty bar space
# does not swallow clicks. `cornice bar toggle | show | hide` shows and hides the bar at runtime.

[bar.left]
# Built-in clock module: formats local time.
#   format is a chrono format string, default "%H:%M".
modules = [
  { kind = "clock", format = "%H:%M", on_click = "notify-send \"$(date +%H:%M)\"" },
]

[bar.center]
# An empty list = that area shows nothing.
modules = []

[bar.right]
modules = [
  # Built-in exec module: runs a shell command and reads its stdout line by line as the module text.
  #   command is required and is run via `sh -c`; after the child exits it is retried after a fixed 1s, no backoff.
  #   format is a template where {out} is replaced by the output; when empty or omitted the raw output is shown.
  #   interval re-runs a one-shot command every N milliseconds instead of keeping the child resident; range 1..=86400000.
  # Battery capacity, read every 5 seconds:
  { kind = "exec", command = "cat /sys/class/power_supply/BAT0/capacity", format = "{out}%", interval = 5000 },
  # 1-minute load average:
  { kind = "exec", command = "awk '{print int($1)}' /proc/loadavg", format = "L{out}", interval = 2000 },
  # Open applications grouped by app_id; the module can be placed in any of the three lists.
  # Chips come from the compositor's window list, and the focused application is highlighted when the
  # compositor reports focus (river does, through the wlroots window list).
  { kind = "applications", on_click = "true" },
]

[notification]
# Presence of this section enables desktop notification cards below the bar. Without it the D-Bus daemon
# still runs, but no card surface is created.
# Horizontal anchor for the whole vertical card column. Default: right.
position = "right" # left | center | right
# How many cards are shown independently at once; the rest stay queued. Default 4. Minimum 1.
max_visible = 4
# Enter duration in milliseconds, default 220.
enter_ms = 220
# Exit duration in milliseconds, default 160.
exit_ms  = 160
